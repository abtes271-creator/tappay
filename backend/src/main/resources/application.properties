spring.application.name=tap-system

# ---- PostgreSQL ----
#spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tapdb}
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/tapdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123456789}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_IN_PROD_1234567890}
# Session expiry: how long a login stays valid before the user must sign in
# again. 300000 = 5 minutes. Tune via the JWT_EXPIRATION_MS env var, e.g.
# 900000 = 15 min, 1800000 = 30 min, 3600000 = 1 hour.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:300000}

# Mail (for admin approval + payment + password-reset notifications)
# Sent via Resend's HTTPS API instead of SMTP, because most hosts (Render
# included) block outbound SMTP ports - HTTPS is never blocked.
# IMPORTANT: RESEND_API_KEY is blank by default and will NOT send real mail
# until set. Get a key at resend.com/api-keys and set it as a real
# environment variable (Render: Environment tab; local: system env var).
app.mail.resend-api-key=${RESEND_API_KEY:re_YLKzVHuR_HHCN9R5tL1aoUv5CiwqQXeGW}
# "From" address. Until you verify your own domain in Resend, you must use
# their shared sender address below. After verifying a domain, change this
# to something like notifications@yourdomain.com via the FROM_EMAIL env var.
app.mail.from=${FROM_EMAIL:onboarding@resend.dev}
app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:admin@example.com}
app.admin.notification-phone=${ADMIN_NOTIFICATION_PHONE:}

# SMS (payment confirmations) - leave blank to disable SMS sending.
# Set these as real environment variables (from your Twilio console) for SMS to work.
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}

# Base URL of the deployed frontend, used to build the password-reset link
# sent by email, e.g. https://app.example.com -> https://app.example.com/reset-password?token=...
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# First admin account, auto-created on startup if no ADMIN exists yet.
# CHANGE THESE before running against a real environment.
app.admin.seed.username=${ADMIN_SEED_USERNAME:admin}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:ChangeMe123!}
app.admin.seed.email=${ADMIN_SEED_EMAIL:abenettesfaye12@gmail.com}

server.port=${PORT:8080}

# CSV card upload (admin panel "Add cards via CSV")
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Rate limiting (per-IP, per-minute) ----
# Protects the server from overload/abuse - NOT the same as raising how many
# real customers it can serve (that's Hikari pool size, a separate setting).
# GENERAL covers all API traffic; AUTH is a tighter cap on login/register/
# password-reset specifically, to blunt brute-force/credential-stuffing.
app.ratelimit.general-per-minute=${RATE_LIMIT_GENERAL:120}
app.ratelimit.auth-per-minute=${RATE_LIMIT_AUTH:10}