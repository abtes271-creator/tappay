server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - let React Router handle client-side paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend service (see docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
